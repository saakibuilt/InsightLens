<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .header-text { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: white; }
      .sidebar-title { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #1e293b; }
      .sidebar-item { font-family: Arial, sans-serif; font-size: 10px; fill: #334155; }
      .chat-title { font-family: Arial, sans-serif; font-size: 14px; fill: #1e293b; font-style: italic; }
      .response-title { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #0369a1; }
      .response-text { font-family: 'Courier New', monospace; font-size: 9px; fill: #334155; }
      .input-text { font-family: Arial, sans-serif; font-size: 10px; fill: #94a3b8; font-style: italic; }
    </style>
  </defs>
  
  <!-- Header -->
  <rect x="10" y="10" width="1180" height="90" fill="#0f172a" stroke="#1e293b" stroke-width="2" rx="5"/>
  <text x="30" y="50" class="header-text">AI Epstein Agent</text>
  <text x="550" y="75" style="font-family: Arial; font-size: 12px; fill: #94a3b8;">Indexing 50,000 records across 42 case files</text>
  
  <!-- Sidebar -->
  <rect x="10" y="110" width="240" height="680" fill="#f8fafc" stroke="#475569" stroke-width="2" rx="5"/>
  <text x="20" y="135" class="sidebar-title">SIDEBAR</text>
  <text x="20" y="165" class="sidebar-item">📤 Upload Case Files</text>
  <text x="20" y="195" class="sidebar-item">🔍 Sources per Answer</text>
  <text x="20" y="215" class="sidebar-item">   min: 3   max: 15</text>
  <text x="20" y="245" class="sidebar-item">🗑️  Clear Conversation</text>
  <text x="20" y="275" class="sidebar-item">🔴 Clear Database</text>
  <text x="20" y="295" class="sidebar-item">   (Wipe All Data)</text>
  
  <!-- Chat Area -->
  <rect x="260" y="110" width="930" height="680" fill="white" stroke="#cbd5e1" stroke-width="1" rx="5"/>
  
  <!-- User Message -->
  <text x="280" y="140" class="chat-title">Q: What was FFO per share in Q3 2024?</text>
  
  <!-- Response Box -->
  <rect x="280" y="180" width="890" height="280" fill="#f0f9ff" stroke="#e2e8f0" stroke-width="1" rx="5"/>
  <text x="300" y="205" class="response-title">Assistant</text>
  <text x="300" y="235" class="response-text">Based on the Q3 2024 investor presentation:</text>
  <text x="300" y="260" class="response-text">[Source 1] FFO per share: $1.23</text>
  <text x="350" y="280" class="response-text">Page 5 • Investor Presentation • v2.1</text>
  <text x="300" y="310" class="response-text">[Source 2] Adjusted FFO per share: $1.19</text>
  <text x="350" y="330" class="response-text">Page 8 • Q3 Earnings Report • v1.0</text>
  <text x="350" y="350" class="response-text">⚠ Published 18 months ago</text>
  
  <!-- Input Box -->
  <rect x="280" y="500" width="890" height="60" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="5"/>
  <text x="300" y="535" class="input-text">💬 Ask a question about the documents...</text>
</svg>
